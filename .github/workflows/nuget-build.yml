name: 'Build and push NuGet Package'

on:
  release:
    types:
      - created

jobs:
  build-nuget:
    name: 'Build NuGet package and push it.'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        projects:
          - 'Renderite.Shared/Renderite.Shared.csproj'
          - 'Renderite.Unity/Renderite.Unity.csproj'

    steps:
      - name: 'Checkout repo'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: 'Pull Unity from cache'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: unity-setup-linux-2019.4.19f1-windows-mono
          path: /home/runner/Unity/Hub/Editor

      - name: 'Install Unity'
        continue-on-error: true
        run: |
          curl -sL https://hub.unity3d.com/linux/keys/public | sudo gpg --dearmor -o /usr/share/keyrings/Unity_Technologies_ApS.gpg
          sudo tee /etc/apt/sources.list.d/unity-cli.sources <<'EOF'
          Types: deb
          URIs: https://hub.unity3d.com/linux/repos/deb
          Suites: unstable
          Components: main
          Signed-By: /usr/share/keyrings/Unity_Technologies_ApS.gpg
          EOF

          sudo apt-get update && sudo apt-get install -y unity-cli

          unity editors -i
          unity install 2019.4.19f1 -a x86_64 -m windows-mono --cm

      - name: 'Build NuGet packages'
        uses: Yellow-Dog-Man/composite-actions-templates/.github/actions/dotnet-build@606ac289d701be7b7d90e5ff8647dedf57d6d755
        with:
          dotnet-build-args: '-p:Version=${{ github.event.release.tag_name }} -o nupkgs'
          dotnet-build-type: 'pack'
          dotnet-project-path: '${{ matrix.projects }}'

      - name: 'Push NuGet'
        uses: Yellow-Dog-Man/composite-actions-templates/.github/actions/dotnet-build-push-nuget@606ac289d701be7b7d90e5ff8647dedf57d6d755
        with:
          dotnet-nuget-auth-token: ${{ secrets.NUGET_TOKEN }}
